services:
  postgres:
    # postgis/postgis statt postgres: gleiche PG-Basis, zusaetzlich die
    # PostGIS-Extension im Image — noetig, damit "geometry"-Spalten auf der
    # PG-Quelle getestet werden koennen. Die Extension wird per
    # CREATE EXTENSION in ein EIGENES Schema "postgis" installiert (nicht
    # "public"): sonst legt PostGIS ~1000 Funktionen in public ab, die das
    # schema_reverse als functions:-Block einsammelt und die Compare-Zahlen
    # auffluten. PG 18 verlangt den Volume-Mount auf /var/lib/postgresql
    # (ohne /data) und ein frisches Volume (Major-Version).
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    container_name: d-migrate-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql
      # Legt beim ersten Init des Volumes PostGIS im eigenen Schema an und
      # setzt den search_path (siehe postgres-init/01-postgis.sh).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Alle DB-Images per Digest gepinnt (wie postgres): die Erwartungsmatrix
  # haengt nicht nur an der d-migrate-Version, sondern auch daran, was die
  # Server beim Reverse liefern. Stand beim Pinnen: SQL Server 2022 CU26,
  # MySQL 8.4.11, oracle-free 23-faststart (Build 2026-08-30).
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    container_name: d-migrate-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    container_name: d-migrate-mssql-init
    restart: "no"
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -C
      - -S
      - mssql
      - -U
      - sa
      - -P
      - "${MSSQL_SA_PASSWORD}"
      - -Q
      - "IF DB_ID('dmigrate') IS NULL CREATE DATABASE dmigrate"

  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    container_name: d-migrate-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: dmigrate
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Lokales Oracle (FREEPDB1) für Cross-Dialect-Round-Trips PG <-> Oracle.
  # gvenzl/oracle-free, Flavor "regular + faststart": das -slim-Flavor
  # entfernt Oracle Spatial und Locator ("uninstalled and removed",
  # $ORACLE_HOME/md) — damit fehlt MDSYS.SDO_GEOMETRY und jede Probe mit
  # SDO_GEOMETRY scheitert mit ORA-00902. APP_USER wird beim ersten Start in
  # FREEPDB1 angelegt (inkl. Tablespace-Quota). Der eingebaute HEALTHCHECK
  # des Images gilt; faststart bootet nach dem ersten Start in ~1-2 Min.
  oracle:
    image: gvenzl/oracle-free:23-faststart@sha256:33322969a450d72c507b08d7f690d9e1d9b60aebaebc35a75b7c0b8ab4baac77
    container_name: d-migrate-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: "${ORACLE_PASSWORD}"
      APP_USER: dmigrate
      APP_USER_PASSWORD: "${ORACLE_PASSWORD}"
    ports:
      - "127.0.0.1:${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  d-migrate-mcp:
    image: ghcr.io/pt9912/d-migrate:1.7.1
    container_name: d-migrate-mcp
    depends_on:
      postgres:
        condition: service_healthy
      mssql-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      oracle:
        condition: service_healthy
    # host networking so the server can bind 127.0.0.1 (required for
    # --auth-mode disabled, which is strictly loopback-only) while still
    # being reachable from the host at 127.0.0.1:8787. Also lets it reach
    # postgres/mssql/mysql/oracle via the host-published
    # 127.0.0.1:${PG_PORT}/${MSSQL_PORT}/${MYSQL_PORT}/${ORACLE_PORT}. Linux-only.
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    # Bewusst KEIN env_file: das reichte alle Secrets der .env (SA-/Root-/
    # Oracle-Passwort, UID/GID) in den Container. Noetig sind nur die fuenf
    # credentialRef-URLs aus .d-migrate.yaml und User/Passwort fuer den
    # server.state-Block (${POSTGRES_USER}/${POSTGRES_PASSWORD} dort).
    # Die Werte kommen per Compose-Interpolation aus .env.
    environment:
      D_MIGRATE_LOCAL_PG_URL: "${D_MIGRATE_LOCAL_PG_URL}"
      D_MIGRATE_LOCAL_MSSQL_URL: "${D_MIGRATE_LOCAL_MSSQL_URL}"
      D_MIGRATE_LOCAL_MYSQL_URL: "${D_MIGRATE_LOCAL_MYSQL_URL}"
      D_MIGRATE_LOCAL_SQLITE_URL: "${D_MIGRATE_LOCAL_SQLITE_URL}"
      D_MIGRATE_LOCAL_ORACLE_URL: "${D_MIGRATE_LOCAL_ORACLE_URL}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    command:
      - mcp
      - serve
      - --transport=http
      - --bind=127.0.0.1
      - --port=8787
      - --auth-mode=disabled
      - --mcp-state-dir=/work/state
      - --connection-config=/work/.d-migrate.yaml
      - --policy-file=/work/policy-rules.yaml
    volumes:
      - ./state:/work/state
      - ./sqlite-data:/work/sqlite-data
      - ./.d-migrate.yaml:/work/.d-migrate.yaml:ro
      - ./policy-rules.yaml:/work/policy-rules.yaml:ro
    restart: unless-stopped

volumes:
  pg-data:
  mssql-data:
  mysql-data:
  oracle-data:
