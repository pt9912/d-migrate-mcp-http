services:
  postgres:
    image: postgres:17.10-trixie
    container_name: d-migrate-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: d-migrate-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: d-migrate-mssql-init
    restart: "no"
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -C
      - -S
      - mssql
      - -U
      - sa
      - -P
      - "${MSSQL_SA_PASSWORD}"
      - -Q
      - "IF DB_ID('dmigrate') IS NULL CREATE DATABASE dmigrate"

  d-migrate-mcp:
    image: ghcr.io/pt9912/d-migrate:1.2.0
    container_name: d-migrate-mcp
    depends_on:
      postgres:
        condition: service_healthy
      mssql-init:
        condition: service_completed_successfully
    # host networking so the server can bind 127.0.0.1 (required for
    # --auth-mode disabled, which is strictly loopback-only) while still
    # being reachable from the host at 127.0.0.1:8787. Also lets it reach
    # postgres/mssql via the host-published 127.0.0.1:${PG_PORT}/${MSSQL_PORT}.
    # Linux-only.
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    command:
      - mcp
      - serve
      - --transport=http
      - --bind=127.0.0.1
      - --port=8787
      - --auth-mode=disabled
      - --mcp-state-dir=/work/state
      - --connection-config=/work/.d-migrate.yaml
      - --policy-file=/work/policy-rules.yaml
    volumes:
      - ./state:/work/state
      - ./.d-migrate.yaml:/work/.d-migrate.yaml:ro
      - ./policy-rules.yaml:/work/policy-rules.yaml:ro
    restart: unless-stopped

volumes:
  pg-data:
  mssql-data:
